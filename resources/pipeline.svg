<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 328" width="880" height="328" role="img" aria-labelledby="t d">
  <title id="t">VoxWeave processing pipeline</title>
  <desc id="d">Stage 1 prepares audio: vocal separation, song-skip and speech chunking. Stage 2 transcribes, aligns words, splits cues and writes a VTT and JSON pair. Speaker diarization is an optional branch from the separated vocals into cue splitting.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1a1a1a"/>
    </marker>
  </defs>
  <rect width="880" height="328" fill="#ffffff"/>
  <style>
    text { font-family: "Times New Roman", "Liberation Serif", Times, serif; fill: #1a1a1a; }
    .h { font-size: 17px; font-weight: 700; }
    .b { font-size: 15px; text-anchor: middle; }
    .s { font-size: 13px; text-anchor: middle; font-style: italic; }
    .m { font-family: "Courier New", "Liberation Mono", monospace; font-size: 12.5px; text-anchor: middle; }
    .n { font-size: 12.5px; font-style: italic; }
    .box { fill: #d4d4d4; stroke: #1a1a1a; stroke-width: 1.6; }
    .io { fill: #ffffff; stroke: #1a1a1a; stroke-width: 2.2; }
    .opt { fill: #ececec; stroke: #1a1a1a; stroke-width: 1.4; stroke-dasharray: 6 4; }
    .ln { stroke: #1a1a1a; stroke-width: 1.6; fill: none; marker-end: url(#a); }
    .ctl { stroke: #1a1a1a; stroke-width: 1.4; fill: none; stroke-dasharray: 6 4; marker-end: url(#a); }
    .sep { stroke: #8a8a8a; stroke-width: 1.2; stroke-dasharray: 2 5; }
  </style>

  <text class="h" x="30" y="26">Stage 1: Prepare audio</text>
  <rect class="io" x="30" y="44" width="175" height="62" rx="9"/>
  <text class="b" x="117.5" y="80">video or audio</text>
  <rect class="box" x="245" y="44" width="175" height="62" rx="9"/>
  <text class="b" x="332.5" y="73">separate vocals</text>
  <text class="s" x="332.5" y="93">Mel-Band Roformer</text>
  <rect class="box" x="460" y="44" width="175" height="62" rx="9"/>
  <text class="b" x="547.5" y="73">skip songs</text>
  <text class="s" x="547.5" y="93">PANNs</text>
  <rect class="box" x="675" y="44" width="175" height="62" rx="9"/>
  <text class="b" x="762.5" y="73">chunk speech</text>
  <text class="s" x="762.5" y="93">Silero VAD, up to 120 s</text>
  <path class="ln" d="M205,75 H245"/>
  <path class="ln" d="M420,75 H460"/>
  <path class="ln" d="M635,75 H675"/>

  <line class="sep" x1="20" y1="132" x2="860" y2="132"/>

  <text class="h" x="30" y="154">Stage 2: Transcribe and lay out</text>
  <rect class="opt" x="245" y="170" width="175" height="52" rx="9"/>
  <text class="b" x="332.5" y="193">speaker turns</text>
  <text class="m" x="332.5" y="211">pyannote, --diarize</text>
  <path class="ctl" d="M332.5,106 V170"/>
  <text class="n" x="342" y="152">opt-in</text>
  <path class="ctl" d="M332.5,222 V248"/>
  <text class="n" x="342" y="240">split at speaker changes</text>

  <rect class="box" x="675" y="248" width="175" height="62" rx="9"/>
  <text class="b" x="762.5" y="277">transcribe</text>
  <text class="s" x="762.5" y="297">Qwen3-ASR</text>
  <rect class="box" x="460" y="248" width="175" height="62" rx="9"/>
  <text class="b" x="547.5" y="277">word timestamps</text>
  <text class="s" x="547.5" y="297">forced alignment</text>
  <rect class="box" x="245" y="248" width="175" height="62" rx="9"/>
  <text class="b" x="332.5" y="277">split into cues</text>
  <text class="s" x="332.5" y="297">smart_split, shot snap</text>
  <rect class="io" x="30" y="248" width="175" height="62" rx="9"/>
  <text class="b" x="117.5" y="277">episode.vtt</text>
  <text class="b" x="117.5" y="297">episode.json</text>

  <path class="ln" d="M762.5,106 V248"/>
  <path class="ln" d="M675,279 H635"/>
  <path class="ln" d="M460,279 H420"/>
  <path class="ln" d="M245,279 H205"/>
</svg>
