name: CI

on:
  push:
    branches: [main]
  pull_request:
  # release.yml runs this workflow on the tagged commit before it publishes.
  workflow_call:

# Cancel superseded runs on the same branch/PR.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Build and test code needs only to read the repository.
permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    # The suite takes minutes; a hung test should not burn the 6 h default.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      # Mirrors `make dev`: core + [cuda] + [diarize] extras + dev group (pytest, pyright).
      # The cuda wheels install fine on a CPU runner; all model paths are
      # lazy-imported or mocked in tests, so nothing touches a GPU.
      # --locked: a pyproject change without its uv.lock update fails here.
      - name: Sync environment
        run: uv sync --locked --extra cuda --extra diarize --dev --python 3.13

      # The Makefile pins the ruff version, so a ruff release that changes
      # its style cannot turn untouched code red.
      - name: Lint
        run: make lint-check

      # Every project `uv run` must name the cuda + diarize extras: the lock resolves
      # forked dependency sets, and a bare `uv run` re-syncs to the base fork.
      - name: Type check
        run: uv run --extra cuda --extra diarize pyright

      - name: Test
        run: env -u TZ -u PYTHONHASHSEED LC_ALL=C.UTF-8 uv run --extra cuda --extra diarize pytest tests/ -q

  # Cross-platform and multi-Python compatibility matrix: verifies that the
  # universal lockfile resolves, typechecks, and passes unit tests across
  # supported Python minors (3.11, 3.12, 3.13) and Apple Silicon [mps].
  compat:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: "3.11"
            variant: cuda
          - os: ubuntu-latest
            python: "3.12"
            variant: cuda
          - os: macos-latest
            python: "3.12"
            variant: mps
          - os: macos-latest
            python: "3.13"
            variant: mps
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Sync environment
        run: uv sync --locked --extra ${{ matrix.variant }} --extra diarize --dev --python "${{ matrix.python }}"

      - name: Type check
        run: uv run --extra ${{ matrix.variant }} --extra diarize pyright

      - name: Test
        run: env -u TZ -u PYTHONHASHSEED LC_ALL=C.UTF-8 uv run --extra ${{ matrix.variant }} --extra diarize pytest tests/ -q

  # The segmentation ruler measures output *quality* against the recorded
  # baseline (calibration/segmentation/baseline.json). Three gates are
  # `blocking` (mid-phrase, over-7s, cps_p90); forbidden_end is configured
  # `warning` but promotes to blocking per language once the baseline and the
  # current run both reach min_samples (zh does; en and ja do not yet). Flipping
  # a gate mode is a reviewed edit of the tracked baseline, not a code change.
  #
  # Zero GPU, zero network, no media: the corpus is tracked JSON replayed through
  # the production entry point; a missing or invalid corpus fails the gate (exit 2).
  segmentation-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      # The recorded baseline carries the python minor it was recorded under;
      # environment_drift refuses a different minor (segmenter behaviour moves
      # with the interpreter), so this job pins the same 3.13 line.
      - name: Sync environment
        run: uv sync --locked --extra cuda --dev --python 3.13

      - name: Segmentation quality gate
        run: make quality-segmentation

      - name: Upload quality report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: segmentation-quality
          path: build/calibration/segmentation-report.json
          if-no-files-found: warn
