name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same branch/PR.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      # The P6 oracle validates its governing reference commits with
      # `git cat-file -e`; a shallow clone lacks them, so fetch full history.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      # The tracked oracle manifest pins the exact interpreter it was recorded
      # under (execution.interpreter); the oracle tests reject any other micro.
      # Reading the pin from the manifest keeps CI in lockstep with each
      # release refresh instead of hardcoding a version that drifts.
      - name: Resolve the oracle interpreter pin
        id: oracle-python
        run: |
          version=$(python3 -c "import json; print(json.load(open('calibration/p6-oracle/manifest.json'))['execution']['interpreter'].split()[1])")
          echo "version=$version" >> "$GITHUB_OUTPUT"

      # Mirrors `make dev`: core + [cuda] extra + dev group (pytest, pyright).
      # The cuda wheels install fine on a CPU runner; all model paths are
      # lazy-imported or mocked in tests, so nothing touches a GPU.
      - name: Sync environment
        run: uv sync --extra cuda --dev --python "${{ steps.oracle-python.outputs.version }}"

      - name: Lint
        run: |
          uv run --no-project --with ruff ruff check .
          uv run --no-project --with ruff ruff format --check .

      - name: Type check
        run: uv run pyright

      # The oracle execution record also pins the ambient environment: locale
      # C.UTF-8, TZ and PYTHONHASHSEED unset. Conform here rather than in the
      # tests — the pin is the gate's contract, not an accident.
      - name: Test
        run: env -u TZ -u PYTHONHASHSEED LC_ALL=C.UTF-8 uv run pytest tests/ -q

  # The segmentation ruler measures output *quality* against the recorded
  # baseline (calibration/segmentation/baseline.json). Three gates are
  # `blocking` (mid-phrase, over-7s, cps_p90); forbidden_end stays `warning`
  # until the en group reaches min_samples (48/100 as of 2026-08). Flipping a
  # gate mode is a reviewed edit of the tracked baseline, not a code change.
  #
  # Zero GPU, zero network, no media: the corpus is tracked JSON replayed through
  # the production entry point. It skips cleanly until the corpus is captured.
  segmentation-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      # The recorded baseline carries the python minor it was recorded under;
      # environment_drift refuses a different minor (segmenter behaviour moves
      # with the interpreter), so this job pins the same 3.13 line.
      - name: Sync environment
        run: uv sync --extra cuda --dev --python 3.13

      - name: Check for a captured corpus
        id: corpus
        run: |
          if [ -f calibration/segmentation/corpus.json ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "No calibration/segmentation/corpus.json yet - skipping the gate."
          fi

      - name: Segmentation quality gate
        if: steps.corpus.outputs.present == 'true'
        run: make quality-segmentation

      - name: Upload quality report
        if: always() && steps.corpus.outputs.present == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: segmentation-quality
          path: build/calibration/segmentation-report.json
          if-no-files-found: warn
